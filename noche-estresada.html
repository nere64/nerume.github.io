<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerume - Noche estresada</title>
    <meta name="description" content="Comic vertical de Noche estresada.">
    <link rel="canonical" href="https://nerume.com/noche-estresada.html">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        :root {
            --fondo: #171311;
            --panel: #2e2622;
            --sombra: #0d0b0a;
            --texto: #a09f97;
            --claro: #cccec7;
            --borde: #77746f;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            background-color: var(--fondo);
            color: var(--texto);
            font-family: 'VT323', monospace;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            z-index: 2;
            background: repeating-linear-gradient(
                0deg,
                transparent 0 3px,
                rgba(204, 206, 199, 0.08) 3px 4px
            );
            mix-blend-mode: screen;
        }

        body::after {
            z-index: 3;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
            animation: ruido 0.18s steps(2) infinite;
        }

        .visor {
            width: min(100%, 960px);
            margin: 0 auto;
            padding: clamp(14px, 3vw, 28px);
            background-color: var(--panel);
            border: 2px solid var(--borde);
            box-shadow: 8px 8px 0 var(--sombra);
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0 0 clamp(14px, 3vw, 24px);
            color: var(--claro);
            font-size: clamp(2rem, 7vw, 4.5rem);
            font-weight: normal;
            text-align: center;
            text-shadow: 4px 4px 0 var(--sombra);
        }

        .comic-vertical {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(100%, 860px);
            min-height: 280px;
            margin: 0 auto;
        }

        .capitulo {
            width: 100%;
            margin-bottom: clamp(18px, 3vw, 28px);
        }

        .capitulo h2 {
            margin: 0 0 12px;
            color: var(--claro);
            font-size: clamp(1.2rem, 2.6vw, 2rem);
            font-weight: normal;
            text-align: center;
        }

        .comic-vertical img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
            scroll-margin-top: 16px;
        }

        .floating-chapter-btn:disabled {
            display: none;
        }

        .mensaje-comic {
            margin: clamp(16px, 3vw, 28px) auto 0;
            color: var(--claro);
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            line-height: 1.2;
            text-align: center;
        }

        .floating-chapter-btn {
            position: fixed;
            right: clamp(12px, 2vw, 22px);
            bottom: clamp(12px, 2vw, 22px);
            width: clamp(54px, 7vw, 76px);
            height: clamp(54px, 7vw, 76px);
            border: 3px solid var(--borde);
            border-radius: 0;
            background-color: var(--fondo);
            background-image: url('favicon.png');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 0 2px var(--sombra), 8px 8px 0 rgba(13, 11, 10, 0.8);
            cursor: pointer;
            z-index: 20;
            animation: flotar 6s ease-in-out infinite;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .floating-chapter-btn:hover,
        .floating-chapter-btn:focus-visible {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 0 2px var(--sombra), 10px 10px 0 rgba(13, 11, 10, 0.85);
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0) rotate(-3deg);
            }
            25% {
                transform: translateY(-4px) rotate(3deg);
            }
            50% {
                transform: translateY(0) rotate(-3deg);
            }
            75% {
                transform: translateY(-4px) rotate(3deg);
            }
        }

        .volver {
            display: block;
            width: max-content;
            max-width: 100%;
            margin: clamp(16px, 3vw, 28px) auto 0;
            padding: 8px 16px;
            background: var(--fondo);
            border: 2px solid var(--borde);
            color: var(--claro);
            font: inherit;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .volver:hover,
        .volver:focus-visible {
            background: var(--claro);
            color: var(--fondo);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes ruido {
            0% { background-position: 0 0; }
            50% { background-position: 12px -8px; }
            100% { background-position: -8px 10px; }
        }

        .visor {
            animation: aparecer 0.7s ease-out;
        }

        @media (max-width: 520px) {
            body { padding: 12px; }
            .visor { box-shadow: 5px 5px 0 var(--sombra); }
        }
    </style>
</head>
<body>
    <main class="visor">
        <h1></h1>

        <div id="comic-vertical" class="comic-vertical" aria-label="Comic vertical de Noche estresada"></div>

        <p class="mensaje-comic">este comic esta siendo avanzado de a poco, tenga paciencia :b</p>

        <button class="volver" type="button" onclick="window.location.href = 'index.html'">volver</button>

        <button id="floating-chapter-btn" class="floating-chapter-btn" type="button" aria-label="Siguiente punto clave"></button>

        <script>
            const comic = document.querySelector('#comic-vertical');
            const floatingBtn = document.querySelector('#floating-chapter-btn');
            const carpetaImagenes = 'NOCHE-IMAGENES/';
            let puntosClave = [];

            const parsearPatronPortada = (nombreArchivo) => {
                const nombre = String(nombreArchivo).trim();
                const coincidencia = nombre.match(/^(?:(?:PORTADA)-(\d+)|(?:[A-Z])(?:\d+)?-PORTADA-(\d+))\.png$/i);

                if (!coincidencia) {
                    return null;
                }

                const esSalto = coincidencia[2] !== undefined;
                return {
                    orden: Number(coincidencia[1] || coincidencia[2]),
                    prioridad: esSalto ? 1 : 0,
                    tipo: esSalto ? 'salto' : 'normal'
                };
            };

            const ordenarArchivos = (archivos) => {
                return [...archivos]
                    .map((archivo) => ({ archivo, datos: parsearPatronPortada(archivo) }))
                    .filter((item) => item.datos)
                    .sort((a, b) => {
                        const pa = a.datos;
                        const pb = b.datos;

                        return pa.orden - pb.orden || pa.prioridad - pb.prioridad;
                    })
                    .map((item) => item.archivo);
            };

            const detectarArchivosPortada = async () => {
                try {
                    const respuesta = await fetch('portadas.json', { cache: 'no-cache' });
                    if (!respuesta.ok) {
                        return [];
                    }

                    const datos = await respuesta.json();
                    const archivos = Array.isArray(datos) ? datos : [];
                    return archivos.filter((archivo) => parsearPatronPortada(archivo));
                } catch (error) {
                    return [];
                }
            };

            const construirComic = async () => {
                const archivos = ordenarArchivos(await detectarArchivosPortada());

                if (!archivos.length) {
                    return;
                }

                const seccion = document.createElement('section');
                seccion.className = 'capitulo';
                seccion.id = 'introduccion';

                const titulo = document.createElement('h2');
                titulo.textContent = 'Noche estresada';
                seccion.appendChild(titulo);

                archivos.forEach((archivo, indice) => {
                    const imagen = new Image();
                    const datos = parsearPatronPortada(archivo);
                    imagen.alt = `Noche estresada - ${archivo}`;
                    imagen.loading = indice === 0 ? 'eager' : 'lazy';
                    imagen.decoding = 'async';
                    if (indice === 0) {
                        imagen.fetchPriority = 'high';
                    }
                    imagen.dataset.salto = String(datos.tipo === 'salto');
                    imagen.onload = () => {
                        imagen.classList.add('cargada');
                    };
                    imagen.onerror = () => {};
                    imagen.src = `${carpetaImagenes}${archivo}`;
                    seccion.appendChild(imagen);
                });

                comic.appendChild(seccion);
                puntosClave = [...seccion.querySelectorAll('img[data-salto="true"]')];
                floatingBtn.disabled = puntosClave.length === 0;
            };

            const moverAlSiguientePunto = () => {
                if (!puntosClave.length) return;

                const estaEnElFondo = window.innerHeight + window.scrollY >= document.body.scrollHeight - 24;
                if (estaEnElFondo) {
                    puntosClave[0].scrollIntoView({ behavior: 'smooth', block: 'start' });
                    return;
                }

                const siguiente = puntosClave.find((punto) => punto.getBoundingClientRect().top > 120);
                if (siguiente) {
                    siguiente.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    return;
                }

                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            };

            floatingBtn.addEventListener('click', () => {
                moverAlSiguientePunto();
            });

            construirComic();
        </script>
    </main>
</body>
</html>
