name: Actualizar lista de portadas

on:
  push:
    paths:
      - '**.png'
      - 'scripts/generate_portadas.py'
      - '.github/workflows/actualizar-portadas.yml'

permissions:
  contents: write

jobs:
  generar-lista:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar portadas.json
        run: python3 scripts/generate_portadas.py

      - name: Guardar lista actualizada
        run: |
          git add portadas.json
          if git diff --cached --quiet; then
            echo "portadas.json ya estaba actualizado"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar lista de portadas"
          git push