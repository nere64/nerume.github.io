<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nerus - Fotos</title>
	<meta name="description" content="Galeria de fotos del blog personal de Nerume.">
	<link rel="canonical" href="https://nerume.com/blog.html">
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="manifest" href="manifest.json">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #171311;
			position: relative;
			color: #cccec7;
			font-family: 'VT323', monospace;
		}

		body::before,
		body::after {
			content: '';
			position: fixed;
			inset: 0;
			pointer-events: none;
		}

		body::before {
			z-index: 2;
			background: repeating-linear-gradient(
				0deg,
				transparent 0 3px,
				rgba(204, 206, 199, 0.08) 3px 4px
			);
			mix-blend-mode: screen;
		}

		body::after {
			z-index: 3;
			opacity: 0.08;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
			animation: ruido 0.18s steps(2) infinite;
		}

		.visor {
			width: min(100%, 720px);
			padding: 18px;
			background: #2e2622;
			border: 2px solid #77746f;
			box-shadow: 8px 8px 0 #0d0b0a;
			position: relative;
			z-index: 1;
		}

		.barra {
			display: flex;
			justify-content: space-between;
			margin-bottom: 18px;
			padding: 6px 10px;
			border: 2px solid #77746f;
			color: #a09f97;
			font-size: 1.2rem;
		}

		h1 {
			margin: 0 0 18px;
			color: #cccec7;
			font-size: clamp(2.5rem, 9vw, 5rem);
			font-weight: normal;
			text-align: center;
		}

		.titulo-con-icono {
			display: inline-flex;
			align-items: center;
			gap: 0.25em;
		}

		.titulo-con-icono img {
			width: 0.65em;
			height: 0.65em;
			object-fit: contain;
		}

		.entradas {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			gap: 18px;
		}

		.entrada {
			margin: 0;
			padding: 10px;
			border: 2px solid #77746f;
			background: #1d1815;
			animation: aparecer 0.7s ease-out;
		}

		.foto {
			aspect-ratio: 1 / 1;
			overflow: hidden;
			border: 2px solid #77746f;
			background: #2e2622;
		}

		.foto img {
			width: 100%;
			height: 100%;
			display: block;
			object-fit: cover;
		}

		.entrada a {
			display: block;
			color: inherit;
		}

		.entrada p {
			margin: 10px 0 0;
			color: #cccec7;
			font-size: 1.3rem;
			line-height: 1.1;
		}

		.vacio {
			margin: 0;
			color: #a09f97;
			font-size: 1.3rem;
			text-align: center;
		}

		.volver {
			padding: 8px 16px;
			background: #1d1815;
			border: 2px solid #77746f;
			color: #cccec7;
			font: inherit;
			font-size: 1.3rem;
			cursor: pointer;
			margin-top: 18px;
		}

		.volver:hover {
			background: #cccec7;
			color: #1d1815;
		}

		@keyframes aparecer {
			from {
				opacity: 0;
				transform: translateY(12px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@keyframes ruido {
			0% {
				background-position: 0 0;
			}
			50% {
				background-position: 12px -8px;
			}
			100% {
				background-position: -8px 10px;
			}
		}
	</style>
</head>
<body>
	<main class="visor">
		<div class="barra">
			<span>nerus fotos:</span>
			<span>[01/03]</span>
		</div>

		<h1 class="titulo-con-icono"><img src="icono-al-lado-del-titulo.png" alt="">FOTOS</h1>

		<div id="entradas" class="entradas"></div>

		<button class="volver" type="button" onclick="window.location.href = 'index.html'">volver</button>
	</main>

	<script>
		const entradas = [
			{
				imagen: "https://i.pinimg.com/originals/02/ca/7c/02ca7c05486d44a62c0feaecf40d01fa.gif",
				texto: "yo tratando de poner gifs aqui"
			},
						{
				imagen: "https://i.imgur.com/Gx7tVZ7.jpeg",
				texto: "se murio mi greymon :,v"
			},
			{
				imagen: "https://i.pinimg.com/736x/61/49/90/614990d6815f5e8ff464023196ff60f1.jpg",
				texto: "yoyoyoyoyo"
			},
			{
				imagen: "https://i.pinimg.com/736x/2a/89/da/2a89dab7510d4ee46ef451a0d88a369c.jpg",
				texto: "MOMANTAIIII"
			},
		];
		const contenedor = document.querySelector('#entradas');
		const contador = document.querySelector('.barra span:last-child');

		if (entradas.length > 0) {
			contenedor.innerHTML = entradas.map((entrada) => `
				<section class="entrada">
				<div class="foto"><img src="${entrada.imagen}" alt="${entrada.texto}"></div>
				<p>${entrada.texto}</p>
				</section>
			`).join('');
			contador.textContent = `01/${entradas.length}`;
		} else {
			contenedor.innerHTML = '<p class="vacio">todavia no hay fotos</p>';
			contador.textContent = '00/00';
		}
	</script>
</body>
</html>
