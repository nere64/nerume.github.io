<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nerus - Fotos</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #171311;
			position: relative;
			color: #cccec7;
			font-family: 'VT323', monospace;
		}

		body::before,
		body::after {
			content: '';
			position: fixed;
			inset: 0;
			pointer-events: none;
		}

		body::before {
			z-index: 2;
			background: repeating-linear-gradient(
				0deg,
				transparent 0 3px,
				rgba(204, 206, 199, 0.08) 3px 4px
			);
			mix-blend-mode: screen;
		}

		body::after {
			z-index: 3;
			opacity: 0.08;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
			animation: ruido 0.18s steps(2) infinite;
		}

		.visor {
			width: min(100%, 720px);
			padding: 18px;
			background: #2e2622;
			border: 2px solid #77746f;
			box-shadow: 8px 8px 0 #0d0b0a;
			position: relative;
			z-index: 1;
		}

		.barra {
			display: flex;
			justify-content: space-between;
			margin-bottom: 18px;
			padding: 6px 10px;
			border: 2px solid #77746f;
			color: #a09f97;
			font-size: 1.2rem;
		}

		h1 {
			margin: 0 0 18px;
			color: #cccec7;
			font-size: clamp(2.5rem, 9vw, 5rem);
			font-weight: normal;
			text-align: center;
		}

		.foto {
			aspect-ratio: 1 / 1;
			overflow: hidden;
			border: 2px solid #77746f;
			background: #1d1815;
			animation: aparecer 0.7s ease-out;
		}

		.foto img {
			width: 100%;
			height: 100%;
			display: block;
			object-fit: cover;
		}

		.controles {
			display: flex;
			justify-content: space-between;
			gap: 10px;
			margin-top: 14px;
		}

		button {
			padding: 8px 16px;
			background: #1d1815;
			border: 2px solid #77746f;
			color: #cccec7;
			font: inherit;
			font-size: 1.3rem;
			cursor: pointer;
		}

		button:hover {
			background: #cccec7;
			color: #1d1815;
		}

		.volver {
			margin-top: 18px;
		}

		@keyframes aparecer {
			from {
				opacity: 0;
				transform: translateY(12px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@keyframes ruido {
			0% {
				background-position: 0 0;
			}
			50% {
				background-position: 12px -8px;
			}
			100% {
				background-position: -8px 10px;
			}
		}
	</style>
</head>
<body>
	<main class="visor">
		<div class="barra">
			<span>nerus@fotos:~$ abrir</span>
			<span>[01/03]</span>
		</div>

		<h1>FOTOS</h1>

		<div class="foto">
			<img id="imagen" src="https://picsum.photos/seed/nerus-01/800/800" alt="Foto de Nerus">
		</div>

		<div class="controles">
			<button id="anterior" type="button">&lt; anterior</button>
			<button id="siguiente" type="button">siguiente &gt;</button>
		</div>

		<button class="volver" type="button" onclick="window.location.href = 'index.html'">volver</button>
	</main>

	<script>
		const fotos = [
			'https://picsum.photos/seed/nerus-01/800/800',
			'https://picsum.photos/seed/nerus-02/800/800',
			'https://picsum.photos/seed/nerus-03/800/800'
		];
		let posicion = 0;
		const imagen = document.querySelector('#imagen');
		const contador = document.querySelector('.barra span:last-child');

		function mostrarFoto() {
			imagen.src = fotos[posicion];
			contador.textContent = `0${posicion + 1}/${fotos.length}`;
		}

		document.querySelector('#anterior').addEventListener('click', () => {
			posicion = (posicion - 1 + fotos.length) % fotos.length;
			mostrarFoto();
		});

		document.querySelector('#siguiente').addEventListener('click', () => {
			posicion = (posicion + 1) % fotos.length;
			mostrarFoto();
		});
	</script>
</body>
</html>
