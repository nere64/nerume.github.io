<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerume</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    html {
        background: #8fe4ff;
        background: linear-gradient(135deg, #8fe4ff 0%, #73e3ff 100%);
        height: 100%;
        margin: 0;
    }
    body {
        font-family: 'Press Start 2P', cursive;
        color: #eefbff;
        text-align: center;
        padding: 20px;
        text-shadow: 3px 3px 0 #185d56;
    }
    .palabrasyippebucle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        letter-spacing: 4px;
        text-transform: lowercase;
        animation: float 2s ease-in-out infinite;
        filter: drop-shadow(0 6px 0 #2a6f8d);
}    
    h1 {
        font-size: 48px;
        margin-bottom: 20px;
        letter-spacing: 4px;
        text-transform: lowercase;
        animation: float 2s ease-in-out infinite;
        filter: drop-shadow(0 6px 0 #2a6f8d);
    }

    .panel {
        background-color: #73e3ff;
        border: 3px solid #fff;
        padding: 20px;
        margin: 10px auto;
        width: 300px;
        box-shadow: 0 0 0 3px #8cd8f7, 8px 8px 0 #3e575e;
    }

    .btn {
        background: linear-gradient(180deg, #baf0ff 0%, #73e3ff 100%);
        color: #fff;
        border: 3px solid #fff;
        padding: 12px 20px;
        font-family: 'Press Start 2P';
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 0 0 3px #8ad1ef, 5px 5px 0 #3e575e;
        transition: transform 0.15s ease;
    }

    .btn:hover {
        transform: translateY(-2px);
    }

.card {
    background-color: #8be8ff;
    border: 3px solid #ffff;
    padding: 15px;
    margin: 10px;
}

.contenedor {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}
</style>
</head>
<body>
    <h1>proximamente</h1>
    <image src="yippee.gif" width="200" height="200"> <br>
</body>
</html>
