<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerume - neru</title>
    <meta name="description" content="Nerume: blog personal, fotos e ideas.">
    <link rel="canonical" href="https://nerume.com/Nerus.html">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
    :root {
            --fondo: #1d1815;
            --panel: #2e2622;
            --sombra: #171311;
            --texto: #a09f97;
            --claro: #cccec7;
            --borde: #77746f;
        }

    body[data-tema="morado"] {
            --fondo: #17121d;
            --panel: #2a2035;
            --sombra: #0e0a13;
            --texto: #aaa0b8;
            --claro: #d8cce5;
            --borde: #776987;
        }

    body[data-tema="celeste"] {
            --fondo: #101b20;
            --panel: #1d3038;
            --sombra: #091014;
            --texto: #9fb4b9;
            --claro: #c8e0e5;
            --borde: #66818a;
        }

    body {
            min-height: 100vh;
            margin: 0;
            padding: 0 24px;
            background: #1d1815 repeating-linear-gradient(
                0deg,
                rgba(204, 206, 199, 0.03) 0,
                rgba(204, 206, 199, 0.03) 1px,
                transparent 1px,
                transparent 5px
            );
            color: var(--texto);
            font-family: 'VT323', monospace;
        }

    body::before,
    body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

    body::before {
            z-index: 2;
            background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(204, 206, 199, 0.08) 3px 4px);
            mix-blend-mode: screen;
        }

    body::after {
            z-index: 3;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
            animation: ruido 0.18s steps(2) infinite;
        }

    h1 {
            color: #a09f97;
            margin: 0;
            font-size: 3rem;
            line-height: 0.9;
            font-weight: normal;
            text-shadow: 4px 4px 0 #171311;
        }

    header {
            padding-top: 50px;
            text-align: left;
            position: relative;
            z-index: 1;
        }

    .titulo-con-icono {
            display: inline-flex;
            align-items: center;
            gap: 0.25em;
        }

    .titulo-con-icono img {
            width: 0.65em;
            height: 0.65em;
            object-fit: contain;
        }

    .selector-temas {
            position: fixed;
            left: max(12px, env(safe-area-inset-left));
            bottom: max(12px, env(safe-area-inset-bottom));
            display: flex;
            gap: 6px;
            z-index: 5;
        }

    .selector-temas button {
            width: 28px;
            height: 28px;
            padding: 0;
            border: 2px solid var(--claro);
            box-shadow: 3px 3px 0 var(--sombra);
            cursor: pointer;
        }

    .tema-actual { background-color: #2e2622; }
    .tema-morado { background-color: #8d5bb5; }
    .tema-celeste { background-color: #5caebe; }
    .tema-ciclico { background-color: #2e2622; }
    body[data-tema="morado"] .tema-ciclico { background-color: #8d5bb5; }
    body[data-tema="celeste"] .tema-ciclico { background-color: #5caebe; }

    @keyframes ruido {
            0% { background-position: 0 0; }
            50% { background-position: 12px -8px; }
            100% { background-position: -8px 10px; }
        }
    </style>
</head>
<body>
    <header>
        <h1 class="titulo-con-icono"><img src="icono-al-lado-del-titulo.png" alt="">NERUME - nerus
        </h1>
        <p>
            aqui va un libro a futuro
        </p>
        <img src="https://i.imgur.com/7IS6fCg.png" width="300" height="300">
    </header>
	<nav class="selector-temas" aria-label="Elegir tema">
		<button class="tema-ciclico" id="boton-tema" type="button" aria-label="Cambiar tema" title="Cambiar tema"></button>
	</nav>
    <script>
        const botonTema = document.querySelector('#boton-tema');
        const temas = ['actual', 'morado', 'celeste'];
        const temaGuardado = localStorage.getItem('tema-nerume');

        if (temaGuardado && temaGuardado !== 'actual') {
            document.body.dataset.tema = temaGuardado;
        }

        botonTema.addEventListener('click', () => {
            const temaActual = document.body.dataset.tema || 'actual';
            const siguienteIndice = (temas.indexOf(temaActual) + 1) % temas.length;
            const siguienteTema = temas[siguienteIndice];

            if (siguienteTema === 'actual') {
                delete document.body.dataset.tema;
                localStorage.removeItem('tema-nerume');
                return;
            }

            document.body.dataset.tema = siguienteTema;
            localStorage.setItem('tema-nerume', siguienteTema);
        });
    </script>
</body>
</html>
