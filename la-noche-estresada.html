<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerume - La noche estresada</title>
    <meta name="description" content="La noche estresada: pensamientos y desahogo del dia a dia.">
    <link rel="canonical" href="https://nerume.com/la-noche-estresada.html">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
    :root {
            --fondo: #1d1815;
            --panel: #2e2622;
            --sombra: #171311;
            --texto: #a09f97;
            --claro: #cccec7;
            --borde: #77746f;
        }

    body {
            min-height: 100vh;
            margin: 0;
            padding: 0 24px;
            background: #2e2622 repeating-linear-gradient(
                0deg,
                rgba(204, 206, 199, 0.03) 0,
                rgba(204, 206, 199, 0.03) 1px,
                transparent 1px,
                transparent 5px
            );
            color: var(--texto);
            font-family: 'VT323', monospace;
        }

    body::before,
    body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

    body::before {
            z-index: 2;
            background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(204, 206, 199, 0.08) 3px 4px);
            mix-blend-mode: screen;
        }

    body::after {
            z-index: 3;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
            animation: ruido 0.18s steps(2) infinite;
        }

    h1 {
            color: #a09f97;
            margin: 0;
            font-size: 3rem;
            line-height: 0.9;
            font-weight: normal;
            text-shadow: 4px 4px 0 #171311;
        }

    header {
            padding-top: 50px;
            text-align: left;
            position: relative;
            z-index: 1;
        }

    .titulo-con-icono {
            display: inline-flex;
            align-items: center;
            gap: 0.25em;
        }

    .titulo-con-icono img {
            width: 0.65em;
            height: 0.65em;
            object-fit: contain;
        }

    .contador-visitas {
            position: fixed;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(12px, env(safe-area-inset-bottom));
            z-index: 5;
            padding: 5px 12px;
            background-color: var(--panel);
            border: 2px solid var(--borde);
            box-shadow: 4px 4px 0 var(--sombra);
            color: var(--texto);
            font-size: 1.15rem;
            white-space: nowrap;
        }

    .contador-visitas strong { color: var(--claro); }

    @keyframes ruido {
            0% { background-position: 0 0; }
            50% { background-position: 12px -8px; }
            100% { background-position: -8px 10px; }
        }
    </style>
</head>
<body>
    <header>
        <h1 class="titulo-con-icono"><img src="icono-al-lado-del-titulo.png" alt="">LA NOCHE ESTRESADA
        </h1>
        <p>
            aqui va un libro a futuro
        </p>
        <img src="https://i.imgur.com/7j2ihvW.png" width="300" height="300">
    </header>
    <div class="contador-visitas">
        visitas: <strong id="numero-visitas">...</strong>
        <script data-goatcounter="https://nere64.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>
    </div>
    <script>
        const numeroVisitas = document.querySelector('#numero-visitas');

        fetch('https://nere64.goatcounter.com/counter//.json', { credentials: 'omit' })
            .then((respuesta) => {
                if (!respuesta.ok) throw new Error('No se pudo consultar el contador');
                return respuesta.json();
            })
            .then((datos) => {
                numeroVisitas.textContent = datos.count ?? '0';
            })
            .catch(() => {
                numeroVisitas.textContent = '...';
            });

    </script>
</body>
</html>
