<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nerus - Fotos</title>
	<meta name="description" content="Galeria de fotos del blog personal de Nerume.">
	<link rel="canonical" href="https://nerume.com/blog.html">
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="manifest" href="manifest.json">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
	<style>
		:root {
			--fondo: #171311;
			--panel: #2e2622;
			--sombra: #0d0b0a;
			--texto: #a09f97;
			--claro: #cccec7;
			--borde: #77746f;
		}

		body[data-tema="morado"] {
			--fondo: #17121d;
			--panel: #2a2035;
			--sombra: #0e0a13;
			--texto: #aaa0b8;
			--claro: #d8cce5;
			--borde: #776987;
		}

		body[data-tema="celeste"] {
			--fondo: #101b20;
			--panel: #1d3038;
			--sombra: #091014;
			--texto: #9fb4b9;
			--claro: #c8e0e5;
			--borde: #66818a;
		}

		body[data-tema="rojo"] {
			--fondo: #160606;
			--panel: #3a0d0d;
			--sombra: #080202;
			--texto: #d08b8b;
			--claro: #f0c1b8;
			--borde: #a34b4b;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #171311;
			position: relative;
			color: #cccec7;
			font-family: 'VT323', monospace;
		}

		body::before,
		body::after {
			content: '';
			position: fixed;
			inset: 0;
			pointer-events: none;
		}

		body::before {
			z-index: 2;
			background: repeating-linear-gradient(
				0deg,
				transparent 0 3px,
				rgba(204, 206, 199, 0.08) 3px 4px
			);
			mix-blend-mode: screen;
		}

		body::after {
			z-index: 3;
			opacity: 0.08;
			background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
			animation: ruido 0.18s steps(2) infinite;
		}

		.visor {
			width: min(100%, 720px);
			padding: 18px;
			background: #2e2622;
			border: 2px solid #77746f;
			box-shadow: 8px 8px 0 #0d0b0a;
			position: relative;
			z-index: 1;
		}

		.barra {
			display: flex;
			justify-content: space-between;
			margin-bottom: 18px;
			padding: 6px 10px;
			border: 2px solid #77746f;
			color: #a09f97;
			font-size: 1.2rem;
		}

		h1 {
			margin: 0 0 18px;
			color: #cccec7;
			font-size: clamp(2.5rem, 9vw, 5rem);
			font-weight: normal;
			text-align: center;
		}

		.titulo-con-icono {
			display: inline-flex;
			align-items: center;
			gap: 0.25em;
		}

		.titulo-con-icono img {
			width: 0.65em;
			height: 0.65em;
			object-fit: contain;
		}

		.entradas {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			gap: 18px;
		}

		.entrada {
			margin: 0;
			padding: 10px;
			border: 2px solid #77746f;
			background: #1d1815;
			animation: aparecer 0.7s ease-out;
		}

		.foto {
			aspect-ratio: 1 / 1;
			overflow: hidden;
			border: 2px solid #77746f;
			background: #2e2622;
		}

		.foto img {
			width: 100%;
			height: 100%;
			display: block;
			object-fit: cover;
		}

		.entrada a {
			display: block;
			color: inherit;
		}

		.entrada p {
			margin: 10px 0 0;
			color: #cccec7;
			font-size: 1.3rem;
			line-height: 1.1;
		}

		.vacio {
			margin: 0;
			color: #a09f97;
			font-size: 1.3rem;
			text-align: center;
		}

		.volver {
			padding: 8px 16px;
			background: #1d1815;
			border: 2px solid #77746f;
			color: #cccec7;
			font: inherit;
			font-size: 1.3rem;
			cursor: pointer;
			margin-top: 18px;
		}

		.volver:hover {
			background: #cccec7;
			color: #1d1815;
		}

		@keyframes aparecer {
			from {
				opacity: 0;
				transform: translateY(12px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@keyframes ruido {
			0% {
				background-position: 0 0;
			}
			50% {
				background-position: 12px -8px;
			}
			100% {
				background-position: -8px 10px;
			}
		}

		body {
			background-color: var(--fondo);
			color: var(--texto);
		}

		.visor,
		.foto {
			background-color: var(--panel);
		}

		.visor,
		.barra,
		.entrada,
		.foto,
		.volver {
			border-color: var(--borde);
		}

		.visor {
			box-shadow: 8px 8px 0 var(--sombra);
		}

		h1,
		.entrada p,
		.volver {
			color: var(--claro);
		}

		.barra,
		.vacio {
			color: var(--texto);
		}

		.entrada {
			background-color: var(--fondo);
		}

		.volver:hover {
			background-color: var(--claro);
			color: var(--fondo);
		}

		.selector-temas {
			position: fixed;
			left: max(12px, env(safe-area-inset-left));
			bottom: max(12px, env(safe-area-inset-bottom));
			display: flex;
			gap: 6px;
			z-index: 5;
		}

		.selector-temas button {
			width: 28px;
			height: 28px;
			padding: 0;
			border: 2px solid var(--claro);
			box-shadow: 3px 3px 0 var(--sombra);
		}

		.tema-actual { background-color: #2e2622; }
		.tema-morado { background-color: #8d5bb5; }
		.tema-celeste { background-color: #5caebe; }
		.tema-ciclico { background-color: #2e2622; }
		body[data-tema="morado"] .tema-ciclico { background-color: #8d5bb5; }
		body[data-tema="celeste"] .tema-ciclico { background-color: #5caebe; }
		body[data-tema="rojo"] .tema-ciclico { background-color: #d83b3b; }

		.contador-visitas {
			position: fixed;
			right: max(12px, env(safe-area-inset-right));
			bottom: max(12px, env(safe-area-inset-bottom));
			z-index: 5;
			padding: 5px 12px;
			background-color: var(--panel);
			border: 2px solid var(--borde);
			box-shadow: 4px 4px 0 var(--sombra);
			color: var(--texto);
			font-size: 1.15rem;
			white-space: nowrap;
		}

		.contador-visitas strong { color: var(--claro); }
	</style>
</head>
<body>
	<main class="visor">
		<div class="barra">
			<span>arte de sam:</span>
		</div>

		<h1 class="titulo-con-icono"><img src="icono-al-lado-del-titulo.png" alt="">ARTE</h1>

		<div id="entradas" class="entradas"></div>

		<button class="volver" type="button" onclick="window.location.href = 'index.html'">volver</button>
	</main>
	<div class="contador-visitas">
		visitas: <strong id="numero-visitas">...</strong>
		<script data-goatcounter="https://nere64.goatcounter.com/count"
				async src="//gc.zgo.at/count.js"></script>
	</div>
	<nav class="selector-temas" aria-label="Elegir tema">
		<button class="tema-ciclico" id="boton-tema" type="button" aria-label="Cambiar tema" title="Cambiar tema"></button>
	</nav>

	<script>
		const numeroVisitas = document.querySelector('#numero-visitas');

		fetch('https://nere64.goatcounter.com/counter//.json', { credentials: 'omit' })
			.then((respuesta) => {
				if (!respuesta.ok) throw new Error('No se pudo consultar el contador');
				return respuesta.json();
			})
			.then((datos) => {
				numeroVisitas.textContent = datos.count ?? '0';
			})
			.catch(() => {
				numeroVisitas.textContent = '...';
			});

		const botonTema = document.querySelector('#boton-tema');
		const temas = ['actual', 'morado', 'celeste', 'rojo'];
		const temaGuardado = localStorage.getItem('tema-nerume');

		if (temaGuardado && temaGuardado !== 'actual') {
			document.body.dataset.tema = temaGuardado;
		}

		botonTema.addEventListener('click', () => {
			const temaActual = document.body.dataset.tema || 'actual';
			const siguienteIndice = (temas.indexOf(temaActual) + 1) % temas.length;
			const siguienteTema = temas[siguienteIndice];

			if (siguienteTema === 'actual') {
				delete document.body.dataset.tema;
				localStorage.removeItem('tema-nerume');
				return;
			}

			document.body.dataset.tema = siguienteTema;
			localStorage.setItem('tema-nerume', siguienteTema);
		});

		const entradas = [
			{
				imagen: "https://i.imgur.com/dXpSruT.jpeg",
				texto: "b r a i n"
			},
		];
		const contenedor = document.querySelector('#entradas');
		const contador = document.querySelector('.barra span:last-child');

		if (entradas.length > 0) {
			contenedor.innerHTML = entradas.map((entrada) => `
				<section class="entrada">
				<div class="foto"><img src="${entrada.imagen}" alt="${entrada.texto}"></div>
				<p>${entrada.texto}</p>
				</section>
			`).join('');
			contador.textContent = `01/${entradas.length}`;
		} else {
			contenedor.innerHTML = '<p class="vacio">todavia no hay fotos</p>';
			contador.textContent = '00/00';
		}
	</script>
</body>
</html>
